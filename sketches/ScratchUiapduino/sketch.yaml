# Arduino スケッチプロファイル
#
# ボードと Tools メニューの設定をここに固定しておくと、
# 受け取った人が手で設定し直す必要がなくなる。
#
# fqbn の各項目は Arduino IDE の Tools メニューに対応する:
#   pnum=V14        Board Version   : V1.4
#   usb=kbdweb      USB             : Keyboard+Mouse+WebHID
#   opt=oslto       Optimize        : Smallest (-Os) with LTO
#   pwm=default     PWM             : TIM2 Default (pin 2 / PC0)     → HID 版
#   pwm=remap3      PWM             : TIM2 Remap3 (pins 9/15/16)     → Remap3 版
#   xserial=none    U(S)ART support : None (use UIAPSerial)
#
# xserial は既定値だが明示してある。HardwareSerial にすると、Serial を一度も
# 呼ばなくても Flash が約 4748 バイト増えて 16KB に収まらない。
# シリアル通信は同梱の UIAPSerial.h / .cpp で行う。
#
# usb は kbdweb でなければならない。WebHID Only ではキーボードとマウスの
# インタフェースが無くなり、そのブロックが動かない。
#
# 2 つのプロファイルは pwm だけが違う。同じ .ino から 2 つの版を作るため。
# 既定は HID 版。Remap3 版は --profile uiapduino-remap3 でビルドする。
# どちらの版になったかはスケッチ側の SKETCH_VARIANT が Tools → PWM から決める。
#
# コアの版（platforms）はわざと書いていない。書くとその版に固定され、
# インストール済みのコアではなく固定した版でビルドされる。
# コアは常に最新を使い、コアが上がるたびに .bin を作り直して配る。
# 利用者はこのスケッチをビルドしないので、これが効くのは .bin を作るときだけ。
# 以前は固定していたが、固定先が 3 回取り残された（1.2.8、1.2.9、1.2.12）。
# 1.2.12 のままでは D11 (PD1) が SWIO のままで IO として働かなかった。

profiles:
  uiapduino:
    notes: UIAPduino (HID ProMicro CH32V003) / Keyboard+Mouse+WebHID / HID 版
    fqbn: UIAP_HID:ch32v:CH32V003:pnum=V14,usb=kbdweb,opt=oslto,pwm=default,xserial=none
  uiapduino-remap3:
    notes: UIAPduino (HID ProMicro CH32V003) / Keyboard+Mouse+WebHID / Remap3 版
    fqbn: UIAP_HID:ch32v:CH32V003:pnum=V14,usb=kbdweb,opt=oslto,pwm=remap3,xserial=none

default_profile: uiapduino
